; PlatformIO Project Configuration File for ShockGuard ESP32-S3
; Automated Skin-Tone-Calibrated Capillary Refill & Perfusion Index Device

[platformio]
default_envs = esp32s3_shockguard

[env:esp32s3_shockguard]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Board Configuration (ESP32-S3-WROOM-1-N16R8)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

; PSRAM Configuration (Octal PSRAM 8MB)
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -DSHOCKGUARD_HW_REV=1

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
